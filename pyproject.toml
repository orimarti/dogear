[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dogear"
dynamic = ["version"]
description = "Bookmark, save and resume Claude Code and Codex sessions from any folder: a tiny session manager with names, tags and notes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oriol Martí" }]
keywords = [
    "claude-code", "claude", "anthropic", "codex", "codex-cli", "openai-codex",
    "sessions", "session-manager", "resume", "bookmark", "bookmarks", "cli", "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/orimarti/dogear"
Issues = "https://github.com/orimarti/dogear/issues"

[project.scripts]
dogear = "dogear.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/dogear/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/dogear"]

[tool.pytest.ini_options]
testpaths = ["tests"]
