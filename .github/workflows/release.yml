name: Release

# Tag v* → build → TestPyPI (install-tested) → PyPI.
# "Run workflow" by hand → build → TestPyPI only (a dry run; PyPI is skipped).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - id: version
        run: echo "version=$(ls dist/*.whl | sed -E 's#dist/dogear-([^-]+)-.*#\1#')" >> "$GITHUB_OUTPUT"
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # re-running a dry run for the same version is fine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install from TestPyPI and run it
        run: |
          for i in 1 2 3 4 5 6; do
            pip install --no-cache-dir --index-url https://test.pypi.org/simple/ "dogear==${{ needs.build.outputs.version }}" && break
            sleep 20  # the index can take a moment to show a new upload
          done
          dogear --version
          DOGEAR_HOME="$RUNNER_TEMP/d" CLAUDE_CONFIG_DIR="$RUNNER_TEMP/c" CODEX_HOME="$RUNNER_TEMP/x" dogear ls

  pypi:
    needs: [build, testpypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
